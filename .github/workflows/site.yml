name: Site

on:
  push:
    branches: [site]
  pull_request:
    branches: [site]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check code blocks
    # Ruling R27: CI runs on our p01 runners. Only this job; deploy stays
    # GitHub-hosted (it needs the Pages OIDC token, and p01 holds no secrets).
    runs-on: [self-hosted, afs-ci]
    steps:
      - uses: actions/checkout@v7

      # p01 has no hostedtoolcache and gha-ci no sudo, so setup-ruby can not
      # run there; mise installs Node and Ruby into the runner's persistent
      # ~/.local/share/mise. Pinned like the gem CI and quantum-enclave's.
      - name: Set up Node and Ruby (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.3
          sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
          cache: false
          mise_toml: |
            [tools]
            node = "24"
            ruby = "3.4"

      - name: Install gems
        run: bundle install --jobs 4

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Run runnable code blocks against the released gems
        run: bundle exec ruby bin/check-code-blocks

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
